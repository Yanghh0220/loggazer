[package]
name = "logpilot-parser"
version = "0.1.0"
edition = "2021"
description = "High-performance log parsing engine for LogPilot — Rust core"
authors = ["LogPilot Team"]
license = "MIT"

[lib]
name = "logpilot_parser"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python-bindings"]
python-bindings = ["pyo3"]
tauri-commands = ["tauri"]
full = ["python-bindings", "tauri-commands"]

[dependencies]
regex = "1"
aho-corasick = "1"
memmap2 = "0.9"
memchr = "2"
chrono = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
thiserror = "2"
log = "0.4"

# Python bindings (optional)
pyo3 = { version = "0.23", features = ["extension-module", "chrono"], optional = true }

# Tauri commands (optional)
tauri = { version = "2", optional = true }

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
rand = "0.8"

[[bench]]
name = "parse_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
