[package]
name = "logpilot-desktop"
version = "0.1.0"
edition = "2021"
description = "LogPilot Desktop — High-performance log analysis with Rust + Tauri"
authors = ["LogPilot Team"]
license = "MIT"

[lib]
name = "logpilot_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Our log parsing engine
logpilot-parser = { path = "../logpilot-parser", features = ["tauri-commands"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
